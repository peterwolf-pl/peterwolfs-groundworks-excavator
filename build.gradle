plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"pw_groundworks_excavator" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		enableClientGameTests = true
		modId = "pw_groundworks_excavator_test"
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "com.piotrek.groundworks:pw_groundworks:${project.groundworks_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

tasks.named("runClientGameTest") {
	def outputPath = providers.gradleProperty("excavatorVisualOutputDir").orElse("visual-tests/current")
	jvmArgs "-Dexcavator.visualOutputDir=${file(outputPath.get()).absolutePath}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('deployToCurseForge', Copy) {
	dependsOn 'jar'
	def cfMods = file("${System.getProperty('user.home')}/Documents/curseforge/minecraft/Instances/26.3 ground_works/mods")
	from tasks.named('jar').flatMap { it.archiveFile }
	into cfMods
	doFirst {
		if (!cfMods.exists()) cfMods.mkdirs()
		cfMods.listFiles()?.each { f ->
			if (f.name.startsWith("pw_groundworks_excavator-") && f.name.endsWith(".jar")) {
				f.delete()
			}
		}
	}
	doLast {
		println "✓ Auto-deployed to ${cfMods.absolutePath}"
	}
}

tasks.named('build').configure {
	finalizedBy('deployToCurseForge')
}
